version: '3.8'

# ---------------------------------------------------------------------------
# Multi-agent trading stack (see agents/__init__.py for the architecture).
# One shared image; each service runs one agent via `command:`.
# Trader container names (in-trading-agent / us-trading-agent) are preserved —
# dashboard/server.js health checks depend on them.
# ---------------------------------------------------------------------------

x-agent-base: &agent-base
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./:/app
    - ./logs:/app/logs
    - ./data:/app/data
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:

  redis:
    image: redis:7-alpine
    container_name: t101-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # =========================================================================
  # INDIA (NSE / Zerodha)
  # =========================================================================

  agent-in:
    <<: *agent-base
    container_name: in-trading-agent
    command: ["python", "-m", "agents.trader"]
    environment:
      - TRADING_MARKET=IN
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=trader
      - KITE_API_KEY=${KITE_API_KEY}
      - KITE_API_SECRET=${KITE_API_SECRET}
      - KITE_USER_ID=${KITE_USER_ID}
      - KITE_PASSWORD=${KITE_PASSWORD}
      - KITE_TOTP_SECRET=${KITE_TOTP_SECRET}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - EOD_API_KEY=${EOD_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_VALIDATION_ENABLED=${AI_VALIDATION_ENABLED:-true}
      - AI_PRIMARY_DRIVER=${AI_PRIMARY_DRIVER:-true}
      # Symbols the bot must never adopt/manage (empty = manage everything,
      # incl. delivery holdings — enabled once DDPI allowed trading them).
      - ZERODHA_IGNORE_HOLDINGS=${ZERODHA_IGNORE_HOLDINGS:-}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - REPORT_RECIPIENT=${REPORT_RECIPIENT}
      - TZ=Asia/Kolkata
      - DASHBOARD_HOST=dashboard-in
      - OBSERVE_ONLY=${OBSERVE_ONLY:-false}
      # HALTED 2026-07-29. The 28-Jul contract note (CNT-26/27-67191195) showed
      # brokerage billed at 0.5% PER LEG, not the min(Rs20, 0.03%) in
      # trading_costs.py: real round trip is 1.22% of notional vs 0.106%
      # modelled, an 11.5x understatement. At ~Rs3,800 sizing every trade needs
      # >1.2% gross just to break even. Exits stay fully live. Clear this only
      # after the cost model is corrected AND sizing clears the brokerage cap.
      - NO_NEW_ENTRIES=${IN_NO_NEW_ENTRIES:-true}
      # IN flattens everything at the close: measured on 50 live round trips,
      # overnight holds lost 4x more per trade than same-day exits and two gap
      # exits were half the period's loss. US deliberately does NOT set this —
      # daily flattening would exhaust its PDT day-trade budget.
      - ALLOW_OVERNIGHT_HOLD=${IN_ALLOW_OVERNIGHT_HOLD:-false}
      # Separate, narrower carve-out (2026-09-30): a LOSING position still
      # gets held overnight if swing confidence clears 45% — independent of
      # ALLOW_OVERNIGHT_HOLD above. Explicitly requested and enabled here
      # despite the measured finding right above (overnight holds lost 4x
      # more per trade on IN) — that measurement covered the general
      # "swing likes it" case at a 65% bar, not this specific lower,
      # losers-only one. Revisit with real fill data once this has run.
      - HOLD_LOSING_SWING_THRESHOLD=${IN_HOLD_LOSING_SWING_THRESHOLD:-0.45}
      # Churn cap. Live IN logs: one symbol entered 5x in a single day; a cap
      # of 2 would have blocked 22% of all BUYs. Expectancy is negative, so
      # each blocked re-entry saves its round-trip friction.
      - MAX_ENTRIES_PER_SYMBOL_PER_DAY=${IN_MAX_ENTRIES_PER_SYMBOL:-2}
      # NRO intraday brokerage cap: 0.5% OR Rs50/order, whichever lower. Without
      # this the model uses uncapped 0.5% and cost stays ~1.42% at ANY size, so
      # the concentrated >Rs10k order gets no benefit and the entry gate never
      # drops. Rs50 is from the NRO rate card — UNCONFIRMED by a contract note
      # on an order >Rs10k; the FIRST such executed trade's note confirms or
      # refutes it (if different, correct this value). With it, cost at ~Rs15k
      # falls to ~1.0% and the 2x gate to ~2.0%.
      - IN_BROKERAGE_CAP=${IN_BROKERAGE_CAP:-50}
      # CONCENTRATED "sniper" sizing (2026-08-03, Option 2): one position at up
      # to 90% of NAV so the order clears Rs10k and the Rs50 brokerage cap
      # engages (cost ~1.0%, entry gate ~2.0% vs 2.83% when tiny). Risk per
      # trade raised to 2.25% so a lone signal can reach ~90% at a 2.5% stop;
      # a single stop-out (~2.25% NAV = ~Rs388) intentionally trips the 2%
      # daily-loss halt. This changes the STAKES, not the ~zero/negative
      # measured edge — concentration raises drawdown/ruin risk. Drop back to
      # ~0.0075 and more positions once NAV makes a >Rs10k order a safe slice.
      - MAX_POSITION_SIZE_PCT=${IN_MAX_POSITION_SIZE:-0.90}
      - MAX_RISK_PER_TRADE_PCT=${IN_MAX_RISK_PER_TRADE:-0.0225}
      # Total open risk across all positions (heat budget). At 0.75%/trade
      # this allows 3 concurrent positions (0.75 x 3 = 2.25%) and refuses the
      # 4th, so 1 position deploys ~30% of NAV, 2 ~60%, 3 ~90%.
      - MAX_PORTFOLIO_HEAT_PCT=${IN_MAX_PORTFOLIO_HEAT:-0.0225}
      - MAX_WEEKLY_LOSS_PCT=${IN_MAX_WEEKLY_LOSS:-0.04}
      # Pyramid-into-winners (2026-09-21). TESTED on US 5-year point-in-time
      # data and REJECTED THERE (CI entirely negative, ~712 clusters, 372
      # worse vs 12 better) — see trade101-pyramid-adds memory. IN has NO
      # backtest evidence at all, and IN's ~1.0-1.4% round-trip friction is
      # 3-5x US's ~0.22%, so the same "extra order = extra friction" and
      # "buys into an already-extended move" mechanisms that lost money on
      # US friction should bite harder here. Enabled anyway on explicit
      # instruction after this was flagged twice.
      - PYRAMID_ENABLED=${PYRAMID_ENABLED:-true}

  orchestrator-in:
    <<: *agent-base
    container_name: in-orchestrator
    command: ["python", "-m", "agents.orchestrator"]
    environment:
      - TRADING_MARKET=IN
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=orchestrator
      - TZ=Asia/Kolkata
      - CONTAINER_TRADER=in-trading-agent
      - CONTAINER_SCANNER=in-scanner
      - CONTAINER_VETTING=in-vetting
      - CONTAINER_STRATEGY=in-strategy
      - CONTAINER_TRAINER=in-trainer
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  scanner-in:
    <<: *agent-base
    container_name: in-scanner
    command: ["python", "-m", "agents.scanner"]
    environment:
      - TRADING_MARKET=IN
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=scanner
      - EOD_API_KEY=${EOD_API_KEY}
      - TZ=Asia/Kolkata

  vetting-in:
    <<: *agent-base
    container_name: in-vetting
    command: ["python", "-m", "agents.vetting"]
    environment:
      - TRADING_MARKET=IN
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=vetting
      - TZ=Asia/Kolkata
      # Match the live trader's entry path so the backtest screen tests the
      # ML-driven strategy that actually trades, not the classic trend path.
      - AI_VALIDATION_ENABLED=${AI_VALIDATION_ENABLED:-true}
      - AI_PRIMARY_DRIVER=${AI_PRIMARY_DRIVER:-true}

  strategy-in:
    <<: *agent-base
    container_name: in-strategy
    command: ["python", "-m", "agents.strategy"]
    environment:
      - TRADING_MARKET=IN
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=strategy
      - TZ=Asia/Kolkata

  trainer-in:
    <<: *agent-base
    container_name: in-trainer
    command: ["python", "-m", "agents.trainer"]
    environment:
      - TRADING_MARKET=IN
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=trainer
      - EOD_API_KEY=${EOD_API_KEY}
      - TZ=Asia/Kolkata

  # =========================================================================
  # US (NASDAQ / Alpaca)
  # =========================================================================

  agent-us:
    <<: *agent-base
    container_name: us-trading-agent
    command: ["python", "-m", "agents.trader"]
    environment:
      - TRADING_MARKET=US
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=trader
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - EOD_API_KEY=${EOD_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_VALIDATION_ENABLED=${AI_VALIDATION_ENABLED:-true}
      - AI_PRIMARY_DRIVER=${AI_PRIMARY_DRIVER:-true}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - REPORT_RECIPIENT=${REPORT_RECIPIENT}
      - TZ=America/New_York
      - DASHBOARD_HOST=dashboard-us
      - OBSERVE_ONLY=${OBSERVE_ONLY:-false}
      # Churn cap. Live US logs: one symbol entered 10x in a single day; 174
      # round trips on a $49 account = 54x turnover, where friction ($5.95)
      # exceeded the entire gross loss ($3.79). A cap of 2 blocks 26% of BUYs.
      # US keeps ALLOW_OVERNIGHT_HOLD unset — see the IN block for why.
      # Losers-only carve-out at a lower 45% swing bar — see the IN block.
      - HOLD_LOSING_SWING_THRESHOLD=${US_HOLD_LOSING_SWING_THRESHOLD:-0.45}
      - MAX_ENTRIES_PER_SYMBOL_PER_DAY=${US_MAX_ENTRIES_PER_SYMBOL:-2}
      # Risk per trade: 0.75% of NAV at the stop. Weekly kill-switch below
      # pauses NEW entries after a -4% NAV week (net of costs).
      - MAX_RISK_PER_TRADE_PCT=${US_MAX_RISK_PER_TRADE:-0.0075}
      # Total open risk across all positions (heat budget) — see the IN block.
      - MAX_PORTFOLIO_HEAT_PCT=${US_MAX_PORTFOLIO_HEAT:-0.0225}
      - MAX_WEEKLY_LOSS_PCT=${US_MAX_WEEKLY_LOSS:-0.04}
      # TLT belongs to the calendar-flow agent (flow-us): the intraday trader
      # must not adopt, stop-manage, or EOD-flatten it.
      - ALPACA_IGNORE_SYMBOLS=${ALPACA_IGNORE_SYMBOLS:-TLT}
      # Pyramid-into-winners (2026-09-21). TESTED here: 24x10-day point-in-time
      # windows, 5 years, 712 symbol-windows, paired same-bars A/B. RESULT WAS
      # NEGATIVE — net/trade -0.200% (off) vs -0.345% (on), paired-diff 95% CI
      # [-543%, -440%] entirely below zero, 372/712 clusters worse vs 12/712
      # better. See trade101-pyramid-adds memory. Enabled anyway on explicit
      # instruction after this result was surfaced and flagged.
      - PYRAMID_ENABLED=${PYRAMID_ENABLED:-true}

  orchestrator-us:
    <<: *agent-base
    container_name: us-orchestrator
    command: ["python", "-m", "agents.orchestrator"]
    environment:
      - TRADING_MARKET=US
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=orchestrator
      - TZ=America/New_York
      - CONTAINER_TRADER=us-trading-agent
      - CONTAINER_SCANNER=us-scanner
      - CONTAINER_VETTING=us-vetting
      - CONTAINER_STRATEGY=us-strategy
      - CONTAINER_TRAINER=us-trainer
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  scanner-us:
    <<: *agent-base
    container_name: us-scanner
    command: ["python", "-m", "agents.scanner"]
    environment:
      - TRADING_MARKET=US
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=scanner
      - EOD_API_KEY=${EOD_API_KEY}
      - TZ=America/New_York

  vetting-us:
    <<: *agent-base
    container_name: us-vetting
    command: ["python", "-m", "agents.vetting"]
    environment:
      - TRADING_MARKET=US
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=vetting
      - TZ=America/New_York
      # US market data (backtest replay + per-stock hybrid thresholds) comes from
      # Alpaca — unlike IN/yfinance there is no keyless route, so this agent needs
      # read-only Alpaca data keys or every US fetch fails and it approves blindly.
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      # Match the live trader's entry path so the backtest screen tests the
      # ML-driven strategy that actually trades, not the classic trend path.
      - AI_VALIDATION_ENABLED=${AI_VALIDATION_ENABLED:-true}
      - AI_PRIMARY_DRIVER=${AI_PRIMARY_DRIVER:-true}

  strategy-us:
    <<: *agent-base
    container_name: us-strategy
    command: ["python", "-m", "agents.strategy"]
    environment:
      - TRADING_MARKET=US
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=strategy
      - TZ=America/New_York
      # SPY index data comes from Alpaca for US (no keyless route); without keys
      # the regime classifier gets "No index data" and never publishes a regime.
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}

  trainer-us:
    <<: *agent-base
    container_name: us-trainer
    command: ["python", "-m", "agents.trainer"]
    environment:
      - TRADING_MARKET=US
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=trainer
      - EOD_API_KEY=${EOD_API_KEY}
      - TZ=America/New_York

  # Month-end Treasury flow (validated 2026-07-22: +0.304%/trade, 24y/288
  # trades). Long TLT, close of 7th-last trading day -> close of 2nd-last,
  # NO stop (the tested spec), ~12 trades/yr. Sleeps outside its window.
  flow-us:
    <<: *agent-base
    container_name: us-flow
    command: ["python", "-m", "agents.flow_trader"]
    environment:
      - TRADING_MARKET=US
      - REDIS_URL=redis://redis:6379/0
      - HC_AGENT=flow
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - TZ=America/New_York
      # HELD OFF until the account clears the size where this is worth its
      # capital lockup: re-enable at ~$500 US (TLT positions ~$250, ~$0.76/
      # trade vs ~$0.15 at $98). The agent still runs — it heartbeats and
      # logs its schedule — so re-enabling is a one-flag change, no redeploy
      # of logic. Set FLOW_ENABLED=true in .env when the threshold is met.
      - FLOW_ENABLED=${FLOW_ENABLED:-false}
      - FLOW_SYMBOL=${FLOW_SYMBOL:-TLT}
      - FLOW_ALLOC_PCT=${FLOW_ALLOC_PCT:-0.5}

  # =========================================================================
  # UK (LSE / IBKR GIA) — standalone long-term growth investing bot.
  # Independent code (uk_growth_bot/), no Redis, no shared agents. OFF by
  # default — enable with COMPOSE_PROFILES=uk. Defaults to PAPER mode
  # (pretend money). Live uses a Trading 212 Stocks & Shares ISA via API key
  # (no extra container). The optional IBKR route also needs the gateway:
  # COMPOSE_PROFILES=uk,uk-ibkr.
  # =========================================================================

  ibeam:
    image: voyz/ibeam:latest
    container_name: uk-ibeam
    profiles: ["uk-ibkr"]
    environment:
      - IBEAM_ACCOUNT=${IBEAM_ACCOUNT}
      - IBEAM_PASSWORD=${IBEAM_PASSWORD}
    # Gateway stays on the internal network only — never publish port 5000.
    restart: unless-stopped

  uk-growth-bot:
    build:
      context: ./uk_growth_bot
      dockerfile: Dockerfile
    container_name: uk-growth-bot
    profiles: ["uk"]
    environment:
      - UK_TRADING_MODE=${UK_TRADING_MODE:-paper}
      - UK_BROKER=${UK_BROKER:-trading212}
      - UK_ACCOUNT_TYPE=${UK_ACCOUNT_TYPE:-isa}
      - T212_ENV=${T212_ENV:-demo}
      - T212_API_KEY=${T212_API_KEY:-}
      - T212_API_SECRET=${T212_API_SECRET:-}
      - IBKR_GATEWAY_URL=https://ibeam:5000
      - UK_MONTHLY_CONTRIBUTION=${UK_MONTHLY_CONTRIBUTION:-200}
      - UK_CONTRIBUTION_DAY=${UK_CONTRIBUTION_DAY:-1}
      - UK_INCOME_TAX_BAND=${UK_INCOME_TAX_BAND:-basic}
      - UK_REGIME_ACTION=${UK_REGIME_ACTION:-pause}
      - UK_CORE_FUNDS=${UK_CORE_FUNDS:-3}
      - UK_CORE_EXIT_RANK=${UK_CORE_EXIT_RANK:-5}
      - UK_CORE_MIN_HOLD_DAYS=${UK_CORE_MIN_HOLD_DAYS:-90}
      - UK_SELL_ONLY_IN_PROFIT=${UK_SELL_ONLY_IN_PROFIT:-true}
      - UK_MIN_SALE_PROFIT_PCT=${UK_MIN_SALE_PROFIT_PCT:-0.01}
      - UK_SATELLITE_PCT=${UK_SATELLITE_PCT:-0.25}
      - UK_NO_NEW_BUYS=${UK_NO_NEW_BUYS:-false}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - UK_REPORT_RECIPIENT=${UK_REPORT_RECIPIENT:-}
      - REPORT_RECIPIENT=${REPORT_RECIPIENT}
      - TZ=Europe/London
    volumes:
      - ./data/uk:/app/data
    restart: unless-stopped

  # India growth investing bot (Zerodha, long-term NSE shares). Separate from
  # agent-in (intraday) but shares its Zerodha account: it reuses agent-in's
  # cached Kite token (./data/kite_access_token.txt) and ring-fences its own
  # cash and shares in ./data/in_growth_reserved.json, which agent-in honours.
  # Starts in simulation; real orders need IN_TRADING_MODE=live.
  in-growth-bot:
    build:
      context: ./in_growth_bot
      dockerfile: Dockerfile
    container_name: in-growth-bot
    environment:
      - IN_TRADING_MODE=${IN_TRADING_MODE:-sim}
      - IN_MONTHLY_CONTRIBUTION=${IN_MONTHLY_CONTRIBUTION:-25000}
      - IN_CONTRIBUTION_DAY=${IN_CONTRIBUTION_DAY:-1}
      - IN_STARTING_CASH=${IN_STARTING_CASH:-0}
      - IN_POSITIONS=${IN_POSITIONS:-8}
      - IN_MAX_PER_SECTOR=${IN_MAX_PER_SECTOR:-2}
      - IN_EXIT_RANK=${IN_EXIT_RANK:-15}
      - IN_MIN_HOLD_DAYS=${IN_MIN_HOLD_DAYS:-365}
      - IN_INCLUDE_ETFS=${IN_INCLUDE_ETFS:-false}
      - IN_SELL_ONLY_IN_PROFIT=${IN_SELL_ONLY_IN_PROFIT:-true}
      - IN_MIN_SALE_PROFIT_PCT=${IN_MIN_SALE_PROFIT_PCT:-0.01}
      - IN_REGIME_ACTION=${IN_REGIME_ACTION:-pause}
      - IN_MIN_ORDER_VALUE=${IN_MIN_ORDER_VALUE:-10000}
      - IN_UK_INCOME_TAX_BAND=${IN_UK_INCOME_TAX_BAND:-}
      - UK_INCOME_TAX_BAND=${UK_INCOME_TAX_BAND:-basic}
      - IN_NO_NEW_BUYS=${IN_NO_NEW_BUYS:-false}
      - KITE_API_KEY=${KITE_API_KEY}
      - KITE_API_SECRET=${KITE_API_SECRET}
      - KITE_USER_ID=${KITE_USER_ID}
      - KITE_PASSWORD=${KITE_PASSWORD}
      - KITE_TOTP_SECRET=${KITE_TOTP_SECRET}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - IN_REPORT_RECIPIENT=${IN_REPORT_RECIPIENT:-}
      - UK_REPORT_RECIPIENT=${UK_REPORT_RECIPIENT:-}
      - REPORT_RECIPIENT=${REPORT_RECIPIENT}
      - TZ=Asia/Kolkata
    volumes:
      - ./data/in:/app/data
      - ./data:/app/shared
    restart: unless-stopped

  # =========================================================================
  # Dashboards (unchanged)
  # =========================================================================

  dashboard-us:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: us-trading-dashboard
    ports:
      - "3001:3000"
    environment:
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - TRADES_CSV_PATH=/data/trades_US.csv
      - AGENT_LOG_PATH=/logs/agent_US.log
      - MARKET_TYPE=US
      - TRADING_MODE=${TRADING_MODE:-paper}
      - TRADING_DB_PATH=/data/trading_US.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/logs
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  dashboard-in:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: in-trading-dashboard
    ports:
      - "3002:3000"
    environment:
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - TRADES_CSV_PATH=/data/trades_IN.csv
      - AGENT_LOG_PATH=/logs/agent_IN.log
      - MARKET_TYPE=IN
      - TRADING_MODE=${TRADING_MODE:-paper}
      - TRADING_DB_PATH=/data/trading_IN.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/logs
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  redis-data:
